name: Builder image

on:
  push:
    branches: [master]
    paths:
      - debian/control
      - packaging/builder.Dockerfile
      - .github/workflows/builder-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: builder-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.suite }}/${{ matrix.arch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: bookworm
            arch: arm64
            platform: linux/arm64
            base: debian:bookworm-slim
          - suite: bookworm
            arch: armhf
            platform: linux/arm/v7
            base: debian:bookworm-slim
          - suite: noble
            arch: arm64
            platform: linux/arm64
            base: ubuntu:24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: docker/setup-qemu-action@49b3bc8e6bdd4a60e6116a5414239cba5943d3cf # v3.2.0
        with:
          platforms: arm64,arm

      - uses: docker/setup-buildx-action@988b5a0280414f521da01fcc63a27aeeb4b104db # v3.6.1

      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@5cd11c3a4ced054e52742c5fd54dca954e0edd85 # v6.7.0
        with:
          context: .
          file: packaging/builder.Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            BASE_IMAGE=${{ matrix.base }}
          tags: ghcr.io/${{ github.repository_owner }}/enviroplus-mqtt-builder:${{ matrix.suite }}-${{ matrix.arch }}
          push: true
          provenance: false
          cache-from: type=gha,scope=builder-${{ matrix.suite }}-${{ matrix.arch }}
          cache-to: type=gha,scope=builder-${{ matrix.suite }}-${{ matrix.arch }},mode=max
