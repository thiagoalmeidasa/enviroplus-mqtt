name: Builder image

on:
  push:
    branches: [master]
    paths:
      - debian/control
      - packaging/builder.Dockerfile
      - .github/workflows/builder-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: builder-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.suite }}/${{ matrix.arch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: bookworm
            arch: arm64
            platform: linux/arm64
            base: debian:bookworm-slim
          - suite: bookworm
            arch: armhf
            platform: linux/arm/v7
            base: debian:bookworm-slim
          - suite: noble
            arch: arm64
            platform: linux/arm64
            base: ubuntu:24.04
          - suite: trixie
            arch: arm64
            platform: linux/arm64
            base: debian:trixie-slim
          - suite: trixie
            arch: armhf
            platform: linux/arm/v7
            base: debian:trixie-slim
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0
        with:
          platforms: arm64,arm

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: packaging/builder.Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            BASE_IMAGE=${{ matrix.base }}
          tags: ghcr.io/${{ github.repository_owner }}/enviroplus-mqtt-builder:${{ matrix.suite }}-${{ matrix.arch }}
          push: true
          provenance: false
          cache-from: type=gha,scope=builder-${{ matrix.suite }}-${{ matrix.arch }}
          cache-to: type=gha,scope=builder-${{ matrix.suite }}-${{ matrix.arch }},mode=max
