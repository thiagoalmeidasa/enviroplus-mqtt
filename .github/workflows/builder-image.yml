name: Builder image

on:
  push:
    branches: [master]
    paths:
      - debian/control
      - packaging/builder.Dockerfile
      - .github/workflows/builder-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: builder-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.suite }}/${{ matrix.arch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: bookworm
            arch: arm64
            platform: linux/arm64
            base: debian:bookworm-slim
          - suite: bookworm
            arch: armhf
            platform: linux/arm/v7
            base: debian:bookworm-slim
          - suite: noble
            arch: arm64
            platform: linux/arm64
            base: ubuntu:24.04
          - suite: trixie
            arch: arm64
            platform: linux/arm64
            base: debian:trixie-slim
          - suite: trixie
            arch: armhf
            platform: linux/arm/v7
            base: debian:trixie-slim
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64,arm

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: packaging/builder.Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            BASE_IMAGE=${{ matrix.base }}
          tags: ghcr.io/${{ github.repository_owner }}/enviroplus-mqtt-builder:${{ matrix.suite }}-${{ matrix.arch }}
          push: true
          provenance: false
          cache-from: type=gha,scope=builder-${{ matrix.suite }}-${{ matrix.arch }}
          cache-to: type=gha,scope=builder-${{ matrix.suite }}-${{ matrix.arch }},mode=max
