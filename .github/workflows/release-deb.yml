name: Release deb

# Builds depend on the prebuilt builder images at
# ghcr.io/<owner>/enviroplus-mqtt-builder:<suite>-<arch>, produced by
# .github/workflows/builder-image.yml. If you're cutting a release for
# the first time after a debian/control change, run that workflow first
# (push to master or `gh workflow run builder-image.yml`).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version_override:
        description: "Override version (without leading v)"
        required: false

permissions:
  contents: write
  packages: read

concurrency:
  group: release-deb-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build deb (${{ matrix.suite }}/${{ matrix.arch }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: bookworm
            arch: arm64
            platform: linux/arm64
          - suite: bookworm
            arch: armhf
            platform: linux/arm/v7
            # piwheels publishes prebuilt armv7 wheels for Pi OS, so pip
            # avoids compiling sdbus/Pillow/numpy under QEMU emulation.
            pip_extra_index_url: https://www.piwheels.org/simple
          - suite: noble
            arch: arm64
            platform: linux/arm64
          - suite: trixie
            arch: arm64
            platform: linux/arm64
          - suite: trixie
            arch: armhf
            platform: linux/arm/v7
            # piwheels publishes prebuilt armv7 wheels for Pi OS, so pip
            # avoids compiling sdbus/Pillow/numpy under QEMU emulation.
            pip_extra_index_url: https://www.piwheels.org/simple
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Derive version
        id: ver
        run: |
          if [ -n "${{ inputs.version_override }}" ]; then
            VERSION="${{ inputs.version_override }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "deb_version=${VERSION}-1~${{ matrix.suite }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0
        with:
          platforms: arm64,arm

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build .deb
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: packaging/build.Dockerfile
          platforms: ${{ matrix.platform }}
          target: deb
          build-args: |
            BUILDER_IMAGE=ghcr.io/${{ github.repository_owner }}/enviroplus-mqtt-builder:${{ matrix.suite }}-${{ matrix.arch }}
            DEB_VERSION=${{ steps.ver.outputs.deb_version }}
            SUITE=${{ matrix.suite }}
            PIP_EXTRA_INDEX_URL=${{ matrix.pip_extra_index_url || '' }}
          outputs: type=local,dest=./out
          provenance: false
          cache-from: type=gha,scope=deb-${{ matrix.suite }}-${{ matrix.arch }}
          cache-to: type=gha,scope=deb-${{ matrix.suite }}-${{ matrix.arch }},mode=max

      - name: Inspect artifacts
        run: ls -la out/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deb-${{ matrix.suite }}-${{ matrix.arch }}
          path: out/*.deb
          if-no-files-found: error

  release:
    name: Attach to GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" artifacts/*.deb --clobber
